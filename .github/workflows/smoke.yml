name: Smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://worksite.aboudiwangeorgio1.workers.dev
          E="smoke-$(date +%s)@test.invalid"
          curl -s -c c -b c -X POST -H "Origin: $B" -H content-type:application/json $B/api/signup -d "{\"email\":\"$E\",\"password\":\"smoketestpass1\"}" -w " %{http_code}\n"
          curl -s -b c -X POST -H "Origin: $B" -H content-type:application/json $B/api/pdf --data-binary @.github/pdf-smoke.json -o out.pdf -w "pdf %{http_code} %{content_type} %{size_download} %{time_total}s\n"
          head -c 8 out.pdf; echo; file out.pdf
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1; pdffonts out.pdf; pdftotext out.pdf - | head -12
          echo "TEST_EMAIL=$E"
